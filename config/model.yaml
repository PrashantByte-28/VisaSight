grid_search:
  class: GridSearchCV
  module: sklearn.model_selection
  params:
    cv: 3
    verbose: 1
model_selection:
  module_0:
    class: HistGradientBoostingClassifier
    module: sklearn.ensemble
    params:
      max_iter: 200
      learning_rate: 0.1
      max_depth: 6
    search_param_grid:
      max_iter:
      - 100
      - 200
      learning_rate:
      - 0.05
      - 0.1
      max_depth:
      - 6
      - 10
  module_1:
    class: RandomForestClassifier
    module: sklearn.ensemble
    params:
      max_depth: 15
      max_features: sqrt
      n_estimators: 100
    search_param_grid:
      max_depth:
      - 10
      - 15
      max_features:
      - sqrt
      n_estimators:
      - 50
      - 100